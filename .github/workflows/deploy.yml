name: Deploy Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lambda
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for AWS auth
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy-winnipeg-tech-events
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_POLL_BOT_TOKEN: ${{ secrets.TELEGRAM_POLL_BOT_TOKEN }}
          TELEGRAM_POLL_CHAT_ID: ${{ secrets.TELEGRAM_POLL_CHAT_ID }}
          CITY: ${{ vars.CITY || 'Winnipeg' }}
          CATEGORIES: ${{ vars.CATEGORIES || 'tech' }}
          PERIOD_DAYS: ${{ vars.PERIOD_DAYS || '30' }}
          TEST_MODE: ${{ vars.TEST_MODE || 'false' }}
        run: ./deploy/deploy.sh

      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name winnipeg-tech-events \
            --payload '{"action":"events"}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            /tmp/out.json
          cat /tmp/out.json
